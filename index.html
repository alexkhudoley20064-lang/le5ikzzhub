<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Le5ikzz Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #0e0e0e;
      --border-color: rgba(255, 255, 255, 0.22);
      --text: #ffffff;
      --hint: #9e9e9e;
      --glow: rgba(255, 255, 255, 0.45);
      --glow-strong: rgba(255, 255, 255, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
    }

    /* Мобильный контейнер */
    .app-wrapper {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 95px;
      background: #000000;
    }

    /* Фоновый рассеянный свет */
    .bg-light {
      position: fixed;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    .tab-content {
      display: none;
      position: relative;
      z-index: 1;
      padding: 22px 16px;
      animation: fadeIn 0.25s ease-out;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ================= ЛУЧИКИ ВОКРУГ АВАТАРА ================= */
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 15px;
    }

    .avatar-halo-container {
      position: relative;
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    .avatar-rays {
      position: absolute;
      width: 270px;
      height: 270px;
      border-radius: 50%;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(255, 255, 255, 0.75) 0deg 4deg,
        rgba(255, 255, 255, 0.15) 4deg 8deg,
        transparent 8deg 16deg
      );
      -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 25%, rgba(0,0,0,0) 72%);
      mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 25%, rgba(0,0,0,0) 72%);
      filter: blur(1.5px);
      animation: rotateRays 28s linear infinite;
    }

    .avatar-glow-center {
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.3) 45%, rgba(0, 0, 0, 0) 75%);
      filter: blur(14px);
      animation: pulseCore 3.5s ease-in-out infinite alternate;
    }

    @keyframes rotateRays {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulseCore {
      0% { transform: scale(0.95); opacity: 0.75; }
      100% { transform: scale(1.08); opacity: 1; }
    }

    .avatar-wrap {
      position: relative;
      width: 142px;
      height: 142px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.95), 0 0 15px rgba(255, 255, 255, 0.7);
      overflow: hidden;
      background: #111;
      z-index: 2;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .creator-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      margin-bottom: 24px;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 290px;
    }

    .tiktok-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #000;
      color: #fff;
      padding: 14px 20px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 15px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .tiktok-btn:active {
      transform: scale(0.96) translateY(2px);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.45);
      background: #151515;
    }

    .tiktok-btn svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    .donate-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #ffffff;
      color: #000000;
      padding: 14px 20px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 15px;
      border: none;
      box-shadow: 0 4px 0 #888, 0 6px 25px var(--glow-strong);
      transition: all 0.12s ease;
      cursor: pointer;
    }

    .donate-btn:active {
      transform: translateY(3px) scale(0.97);
      box-shadow: 0 1px 0 #888, 0 3px 15px rgba(255, 255, 255, 0.5);
    }

    /* ================= ИГРЫ ================= */
    .games-header {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 22px;
      letter-spacing: -0.5px;
      text-align: center;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .games-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .game-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 24px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.08);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .game-card:active {
      transform: scale(0.98);
      border-color: rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 30px var(--glow);
    }

    .game-left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .game-icon-wrap {
      width: 70px;
      height: 70px;
      border-radius: 18px;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
      overflow: hidden;
      background: #111;
      flex-shrink: 0;
    }

    .game-icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .game-name {
      font-size: 17.5px;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-desc {
      font-size: 13px;
      color: var(--hint);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-action-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 800;
      box-shadow: 0 4px 0 #777, 0 0 20px rgba(255, 255, 255, 0.5);
      flex-shrink: 0;
      transition: all 0.1s ease;
      cursor: pointer;
    }

    .game-card:active .play-action-btn {
      transform: translateY(3px) scale(0.96);
      box-shadow: 0 1px 0 #777, 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .bottom-glow {
      margin-top: 35px;
      height: 60px;
      background: radial-gradient(ellipse at center bottom, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 50%, transparent 80%);
      filter: blur(10px);
      pointer-events: none;
    }

    /* ================= НАВИГАЦИЯ ================= */
    .nav-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 390px;
      height: 58px;
      background: rgba(14, 14, 14, 0.88);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 30px;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 4px;
      z-index: 100;
    }

    .nav-item {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      color: var(--hint);
      font-size: 14.5px;
      font-weight: 700;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-item.active {
      color: #000000;
      background: #ffffff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body>

  <div class="bg-light"></div>

  <div class="app-wrapper">
    <!-- ВКЛАДКА 1: ГЛАВНАЯ -->
    <div class="tab-content active" id="tab-home">
      <div class="profile-section">
        
        <div class="avatar-halo-container">
          <div class="avatar-rays"></div>
          <div class="avatar-glow-center"></div>
          <div class="avatar-wrap">
            <img src="https://i.ibb.co/GQh2t4qQ/IMG-3387.png" alt="Le5ikzz">
          </div>
        </div>

        <div class="creator-title">Игры от Le5ikzz</div>

        <div class="action-buttons">
          <button class="tiktok-btn" onclick="openLink('https://www.tiktok.com/@le5ikzz')">
            <svg viewBox="0 0 24 24">
              <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.298-.002.595.042.88.13V9.4a6.33 6.33 0 0 0-1-.08A6.34 6.34 0 0 0 3 15.66a6.34 6.34 0 0 0 10.82 4.47 6.27 6.27 0 0 0 1.86-4.47V8.78a8.18 8.18 0 0 0 4.91 1.63V6.97a4.85 4.85 0 0 1-1-.28z"/>
            </svg>
            Мой TikTok
          </button>

          <button class="donate-btn" onclick="supportAuthor()">
            Поддержать Автора 🤗
          </button>
        </div>
      </div>
    </div>

    <!-- ВКЛАДКА 2: ИГРЫ -->
    <div class="tab-content" id="tab-games">
      <div class="games-header">Каталог игр</div>
      
      <div class="games-list">
        <!-- Игра 1: ChizhCity -->
        <div class="game-card" onclick="openGame('https://t.me/lekkzhubBot/Chizhik')">
          <div class="game-left">
            <div class="game-icon-wrap">
              <img src="https://i.ibb.co/LDjD1QwZ/749-FAD4-D-0929-4524-8326-786-EA32-CFDAB.jpg" alt="ChizhCity">
            </div>
            <div class="game-meta">
              <div class="game-name">ChizhCity</div>
              <div class="game-desc">ждёт своего Мэра!</div>
            </div>
          </div>
          <button class="play-action-btn">Играть</button>
        </div>

        <!-- Игра 2: StackBags -->
        <div class="game-card" onclick="openGame('https://alexkhudoley20064-lang.github.io/Stack-Bags/')">
          <div class="game-left">
            <div class="game-icon-wrap">
              <img src="https://i.ibb.co/GfBXTjjs/E8278-B9-F-4-BA3-4-F1-A-B382-A53640880-F28.jpg" alt="StackBags">
            </div>
            <div class="game-meta">
              <div class="game-name">StackBags</div>
              <div class="game-desc">ждёт своего Покупателя!</div>
            </div>
          </div>
          <button class="play-action-btn">Играть</button>
        </div>

        <!-- Игра 3: DarkStore Legend -->
        <div class="game-card" onclick="openGame('https://alexkhudoley20064-lang.github.io/darkstore_legend/')">
          <div class="game-left">
            <div class="game-icon-wrap">
              <img src="https://i.ibb.co/KjrJJBWQ/F1-ABB81-C-7-F6-F-4046-886-F-71-A4-A66-AC1-DA.jpg" alt="DarkStore Legend">
            </div>
            <div class="game-meta">
              <div class="game-name">DarkStore Legend</div>
              <div class="game-desc">ждёт своего сборщика!</div>
            </div>
          </div>
          <button class="play-action-btn">Играть</button>
        </div>

        <!-- Игра 4: Priemka Geek -->
        <div class="game-card" onclick="openGame('dev')">
          <div class="game-left">
            <div class="game-icon-wrap">
              <img src="https://i.ibb.co/DgLWg6Y3/E30684-EF-0031-4886-98-D7-5118-C4153-D4-B.jpg" alt="Priemka Geek">
            </div>
            <div class="game-meta">
              <div class="game-name">Priemka Geek</div>
              <div class="game-desc">пока в разработке 🤩</div>
            </div>
          </div>
          <button class="play-action-btn">Играть</button>
        </div>
      </div>

      <!-- Мягкое свечение снизу -->
      <div class="bottom-glow"></div>
    </div>

    <!-- Навигация -->
    <nav class="nav-bar">
      <button class="nav-item active" onclick="switchTab('home', this)">Главная</button>
      <button class="nav-item" onclick="switchTab('games', this)">Игры</button>
    </nav>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const DONATE_INVOICE_URL = "https://t.me/$KBSu_fmfAUsSFwAAWco2j0i_juU";

    function supportAuthor() {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      if (tg?.openInvoice) {
        tg.openInvoice(DONATE_INVOICE_URL, function(status) {
          if (status === 'paid') {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert("Огромное спасибо за поддержку! 🖤⭐");
          }
        });
      } else {
        window.open(DONATE_INVOICE_URL, '_blank');
      }
    }

    function switchTab(tabId, el) {
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      el.classList.add('active');
    }

    function openLink(url) {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      if (tg?.openLink) {
        tg.openLink(url);
      } else {
        window.open(url, '_blank');
      }
    }

    function openGame(url) {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');

      // Если игра в разработке
      if (url === 'dev') {
        if (tg?.showAlert) {
          tg.showAlert("Игра 'Priemka Geek' пока находится в активной разработке! Скоро релиз 🤩");
        } else {
          alert("Игра 'Priemka Geek' пока находится в активной разработке! Скоро релиз 🤩");
        }
        return;
      }

      // Открытие Telegram Mini App
      if (tg?.openTelegramLink && url.startsWith('https://t.me/')) {
        tg.openTelegramLink(url);
      } 
      // Открытие внешней веб-игры (GitHub Pages)
      else if (tg?.openLink) {
        tg.openLink(url);
      } 
      else {
        window.open(url, '_blank');
      }
    }
  </script>
</body>
</html>
